[package]
name = "openduck"
version = "0.2.0"
edition = "2021"
authors = ["OpenDuck Contributors"]
description = "A flat file SQL client based on DuckDB built with Ratatui"
license = "MIT"

[lib]
name = "openduck"
path = "src/lib.rs"

[[bin]]
name = "openduck"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
duckdb = { version = "1.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
arboard = "3.4"
csv = "1.3"
anyhow = "1.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.17"
